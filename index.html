<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Taman Kucing & Bunga Ajaib 🌸🐾 | Naya & Ruby</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Three.js & Controls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --primary-orange: #ff7e40;
      --light-orange: #ffa970;
      --soft-orange: #ffe3d1;
      --primary-pink: #ff6584;
      --light-pink: #ffa4b6;
      --soft-pink: #ffeaf0;
      --accent-yellow: #ffd166;
      --white: #ffffff;
      --text-dark: #5a3848;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Fredoka', 'Quicksand', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      color: var(--text-dark);
      background: linear-gradient(135deg, #ffd3b6 0%, #ffaaa5 50%, #ff8b94 100%);
      transition: background 1.2s ease;
    }

    /* Ambient themes */
    body.theme-morning {
      background: radial-gradient(circle at 50% 20%, #ffe9d6 0%, #ffd0c7 45%, #ffb2c9 100%);
    }
    body.theme-sunset {
      background: radial-gradient(circle at 60% 40%, #ffa07a 0%, #ff758c 50%, #b84b72 100%);
    }
    body.theme-twilight {
      background: radial-gradient(circle at 50% 30%, #ff9a9e 0%, #a18cd1 55%, #594075 100%);
    }

    #webgl-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      cursor: grab;
    }
    #webgl-container:active {
      cursor: grabbing;
    }

    /* UI Overlay */
    .ui-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    /* Top Header */
    .header-box {
      pointer-events: auto;
      max-width: 540px;
      margin: 0 auto;
      text-align: center;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 14px 26px;
      box-shadow: 0 12px 36px rgba(255, 110, 130, 0.22),
                  0 0 0 4px rgba(255, 255, 255, 0.9);
      animation: floatSlow 4s ease-in-out infinite alternate;
    }

    @keyframes floatSlow {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-6px); }
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .header-box h1 {
      font-size: 1.65rem;
      font-weight: 700;
      background: linear-gradient(45deg, #ff5e36, #ff4071, #ff8c42);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }

    .badge-icon {
      font-size: 1.7rem;
      display: inline-block;
      animation: wiggle 2.5s infinite ease-in-out;
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-12deg) scale(1.1); }
      75% { transform: rotate(12deg) scale(1.1); }
    }

    .header-box p {
      font-size: 0.95rem;
      color: #7a4658;
      font-weight: 500;
      margin-top: 4px;
    }

    /* Counters and Badges */
    .stats-bar {
      margin-top: 8px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .pill-stat {
      background: linear-gradient(135deg, #fff0f3, #ffe8dc);
      border: 1.5px solid #ffccd5;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #ff5478;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 3px 8px rgba(255, 126, 64, 0.12);
    }

    /* Speech Bubble for Cat */
    .cat-speech-bubble {
      position: absolute;
      pointer-events: auto;
      transform: translate(-50%, -100%);
      background: #ffffff;
      padding: 12px 20px;
      border-radius: 22px;
      box-shadow: 0 10px 30px rgba(255, 100, 130, 0.25);
      border: 3px solid #ffadc1;
      font-size: 1.05rem;
      font-weight: 600;
      color: #e63964;
      white-space: nowrap;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      opacity: 0;
      pointer-events: none;
      z-index: 15;
    }
    .cat-speech-bubble.active {
      opacity: 1;
      transform: translate(-50%, -120%) scale(1);
    }
    .cat-speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 10px 10px 0;
      border-style: solid;
      border-color: #ffffff transparent;
      display: block;
      width: 0;
    }
    .cat-speech-bubble::before {
      content: '';
      position: absolute;
      bottom: -14px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 13px 13px 0;
      border-style: solid;
      border-color: #ffadc1 transparent;
      display: block;
      width: 0;
    }

    /* Action Buttons (Bottom) */
    .controls-container {
      pointer-events: auto;
      max-width: 720px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .hint-chip {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(8px);
      padding: 6px 18px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #bf4065;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
      animation: pulseHint 2s infinite ease-in-out;
    }

    @keyframes pulseHint {
      0%, 100% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.03); }
    }

    .btn-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      width: 100%;
    }

    .action-btn {
      background: #ffffff;
      border: none;
      outline: none;
      padding: 10px 18px;
      border-radius: 20px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      color: #e65c00;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 20px rgba(255, 126, 64, 0.25),
                  0 0 0 3px #ffffff;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .action-btn:hover {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 10px 24px rgba(255, 100, 130, 0.35),
                  0 0 0 3px #ffe1e8;
    }

    .action-btn:active {
      transform: translateY(1px) scale(0.96);
    }

    .action-btn.pink {
      color: #d81b60;
      box-shadow: 0 6px 20px rgba(233, 30, 99, 0.25),
                  0 0 0 3px #ffffff;
    }
    .action-btn.pink:hover {
      box-shadow: 0 10px 24px rgba(233, 30, 99, 0.35),
                  0 0 0 3px #ffd6e0;
    }

    .action-btn.gold {
      color: #b78103;
      box-shadow: 0 6px 20px rgba(255, 193, 7, 0.25),
                  0 0 0 3px #ffffff;
    }

    /* Floating quick sound & theme buttons on top corners */
    .top-left-tools, .top-right-tools {
      position: absolute;
      top: 20px;
      pointer-events: auto;
      display: flex;
      gap: 10px;
      z-index: 20;
    }
    .top-left-tools { left: 20px; }
    .top-right-tools { right: 20px; }

    .tool-circle-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 3px solid #ffffff;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      box-shadow: 0 6px 18px rgba(255, 105, 135, 0.25);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      transition: all 0.25s ease;
    }
    .tool-circle-btn:hover {
      transform: scale(1.12) rotate(8deg);
      background: #ffffff;
    }
    .tool-circle-btn:active {
      transform: scale(0.92);
    }

    /* Little Heart Popups */
    .floating-heart {
      position: absolute;
      pointer-events: none;
      font-size: 1.8rem;
      animation: floatUpFade 1.4s ease-out forwards;
      z-index: 30;
    }

    @keyframes floatUpFade {
      0% {
        opacity: 1;
        transform: translate(-50%, 0) scale(0.5) rotate(0deg);
      }
      50% {
        transform: translate(calc(-50% + 20px), -60px) scale(1.2) rotate(15deg);
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% - 15px), -130px) scale(1) rotate(-15deg);
      }
    }

    /* Mobile adjustments */
    @media (max-width: 600px) {
      .header-box {
        padding: 10px 16px;
        border-radius: 22px;
      }
      .header-box h1 {
        font-size: 1.25rem;
      }
      .badge-icon {
        font-size: 1.35rem;
      }
      .header-box p {
        font-size: 0.82rem;
      }
      .action-btn {
        padding: 8px 14px;
        font-size: 0.85rem;
        border-radius: 16px;
      }
      .top-left-tools, .top-right-tools {
        top: 12px;
      }
      .top-left-tools { left: 12px; }
      .top-right-tools { right: 12px; }
      .tool-circle-btn {
        width: 42px;
        height: 42px;
        font-size: 1.15rem;
      }
    }
  </style>
</head>
<body class="theme-morning">

  <div id="webgl-container"></div>

  <!-- Cat Speech Bubble -->
  <div id="catBubble" class="cat-speech-bubble">
    Meow! Halo Naya & Ruby! 🐾
  </div>

  <!-- Top Side Tools -->
  <div class="top-left-tools">
    <button id="btnSound" class="tool-circle-btn" title="Musik Riang">🎵</button>
    <button id="btnTheme" class="tool-circle-btn" title="Ganti Suasana (Pagi/Sore/Malam)">🌅</button>
  </div>

  <div class="top-right-tools">
    <button id="btnCameraReset" class="tool-circle-btn" title="Reset Pandangan">🔍</button>
    <button id="btnConfetti" class="tool-circle-btn" title="Pesta Balon & Bunga!">🎉</button>
  </div>

  <!-- Main UI Layer -->
  <div class="ui-layer">
    <!-- Header -->
    <div class="header-box">
      <div class="title-row">
        <span class="badge-icon">🐱</span>
        <h1>Taman Bunga & Kucing Ajaib</h1>
        <span class="badge-icon">🌸</span>
      </div>
      <p>Dibuat spesial penuh cinta untuk Naya & Ruby 💕</p>
      
      <div class="stats-bar">
        <div class="pill-stat">
          <span>🌸 Bunga Mekar:</span>
          <span id="flowerCount">0</span>
        </div>
        <div class="pill-stat" style="color: #ff851b; border-color: #ffd8a8; background: #fff9f2;">
          <span>🐾 Sahabat:</span>
          <span>Mimi si Kucing Oren</span>
        </div>
      </div>
    </div>

    <!-- Bottom Controls -->
    <div class="controls-container">
      <div class="hint-chip">
        ✨ Sentuh taman untuk menumbuhkan bunga, atau klik kucing Mimi! ✨
      </div>

      <div class="btn-row">
        <button id="btnFeed" class="action-btn">
          <span>🐟</span> Beri Ikan
        </button>
        <button id="btnYarn" class="action-btn pink">
          <span>🧶</span> Main Benang
        </button>
        <button id="btnFlowerRain" class="action-btn gold">
          <span>🌸</span> Hujan Kelopak
        </button>
        <button id="btnPet" class="action-btn pink">
          <span>💕</span> Elus Kucing
        </button>
      </div>
    </div>
  </div>

  <script>
    /* =========================================================
       AUDIO SYNTHESIZER (Web Audio API - No external audio files!)
       ========================================================= */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.musicPlaying = false;
        this.melodyTimer = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      // Gentle synth tone
      playTone(freq, type = 'sine', duration = 0.3, volume = 0.15) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

        gain.gain.setValueAtTime(volume, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start();
        osc.stop(this.ctx.currentTime + duration);
      }

      // Adorable Cat Meow sound synthesis
      playMeow() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'triangle';
        // Pitch bend like a cute kitten meow (high -> swoop up -> down)
        osc.frequency.setValueAtTime(480, now);
        osc.frequency.linearRampToValueAtTime(820, now + 0.18);
        osc.frequency.exponentialRampToValueAtTime(420, now + 0.55);

        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.2, now + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.55);
      }

      // Happy Purr / Chime
      playPurr() {
        this.init();
        if (!this.ctx) return;
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C E G C
        notes.forEach((freq, idx) => {
          setTimeout(() => {
            this.playTone(freq, 'sine', 0.4, 0.12);
          }, idx * 70);
        });
      }

      // Flower Sprout sound (magical harp / bell)
      playSprout() {
        this.init();
        if (!this.ctx) return;
        const freqs = [659.25, 880, 1174.66]; // E5, A5, D6
        freqs.forEach((f, i) => {
          setTimeout(() => this.playTone(f, 'triangle', 0.25, 0.08), i * 50);
        });
      }

      // Eating sound (cute nibble)
      playNibble() {
        this.init();
        if (!this.ctx) return;
        for (let i = 0; i < 4; i++) {
          setTimeout(() => {
            this.playTone(600 + Math.random() * 200, 'triangle', 0.08, 0.1);
          }, i * 90);
        }
      }

      // Background soft lullaby chime loop
      toggleMusic() {
        this.init();
        if (this.musicPlaying) {
          clearInterval(this.melodyTimer);
          this.musicPlaying = false;
          return false;
        } else {
          this.musicPlaying = true;
          const melody = [
            523.25, 587.33, 659.25, 783.99, 659.25, 587.33,
            523.25, 659.25, 783.99, 880.00, 783.99, 659.25,
            698.46, 659.25, 587.33, 523.25, 587.33, 659.25
          ];
          let step = 0;
          this.melodyTimer = setInterval(() => {
            if (!this.musicPlaying) return;
            const note = melody[step % melody.length];
            this.playTone(note, 'sine', 0.6, 0.04);
            step++;
          }, 450);
          return true;
        }
      }
    }

    const sound = new SoundEngine();

    /* =========================================================
       THREE.JS 3D SCENE SETUP
       ========================================================= */
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    
    // Camera
    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    const defaultCamPos = new THREE.Vector3(0, 7, 14);
    camera.position.copy(defaultCamPos);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild(renderer.domElement);

    // Orbit Controls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2.05; // Don't go below ground
    controls.minDistance = 6;
    controls.maxDistance = 22;
    controls.target.set(0, 1.2, 0);

    /* =========================================================
       LIGHTING (Warm Peach & Soft Pink Glow - Balanced)
       ========================================================= */
    const ambientLight = new THREE.AmbientLight(0xffe8ee, 0.55);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfff6ec, 0.85);
    sunLight.position.set(10, 18, 12);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 50;
    const d = 10;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    scene.add(sunLight);

    // Subtle warm orange rim light
    const warmRimLight = new THREE.DirectionalLight(0xffa550, 0.35);
    warmRimLight.position.set(-10, 8, -10);
    scene.add(warmRimLight);

    /* =========================================================
       MEADOW GROUND (Lush Fresh Green Island)
       ========================================================= */
    const groundGroup = new THREE.Group();
    scene.add(groundGroup);

    // Main mound (Rich earth & grass base)
    const groundGeo = new THREE.CylinderGeometry(8.5, 9.2, 1.8, 48);
    const groundMat = new THREE.MeshToonMaterial({
      color: 0x48a855 // Rich natural spring meadow green
    });
    const groundMesh = new THREE.Mesh(groundGeo, groundMat);
    groundMesh.position.y = -0.9;
    groundMesh.receiveShadow = true;
    groundGroup.add(groundMesh);

    // Fresh Grassy Top Surface
    const domeGeo = new THREE.CylinderGeometry(8.5, 8.6, 0.25, 48);
    const domeMat = new THREE.MeshToonMaterial({
      color: 0x5cb85c // Cheerful vibrant green grass
    });
    const domeMesh = new THREE.Mesh(domeGeo, domeMat);
    domeMesh.position.y = 0.05;
    domeMesh.receiveShadow = true;
    groundGroup.add(domeMesh);

    // Cute decorative grass tufts around the meadow
    const tuftMat = new THREE.MeshToonMaterial({ color: 0x3d9443 });
    for (let i = 0; i < 28; i++) {
      const tuftG = new THREE.Group();
      const bladeGeo = new THREE.ConeGeometry(0.06, 0.3 + Math.random() * 0.15, 5);
      for (let b = -1; b <= 1; b++) {
        const blade = new THREE.Mesh(bladeGeo, tuftMat);
        blade.rotation.z = b * 0.28 + (Math.random() - 0.5) * 0.15;
        blade.position.set(b * 0.05, 0.15, 0);
        tuftG.add(blade);
      }
      const angle = Math.random() * Math.PI * 2;
      const radius = 1.8 + Math.random() * 5.6;
      tuftG.position.set(Math.cos(angle) * radius, 0.12, Math.sin(angle) * radius);
      tuftG.rotation.y = Math.random() * Math.PI;
      groundGroup.add(tuftG);
    }

    // Stepping stones around the meadow (Soft peach-terracotta)
    const stoneMat = new THREE.MeshToonMaterial({ color: 0xf5cbb5 });
    for (let i = 0; i < 7; i++) {
      const stoneGeo = new THREE.CylinderGeometry(0.5 + Math.random()*0.3, 0.6 + Math.random()*0.2, 0.12, 16);
      const stone = new THREE.Mesh(stoneGeo, stoneMat);
      const angle = (i / 7) * Math.PI * 2 + 0.3;
      const radius = 4.2 + Math.random() * 1.5;
      stone.position.set(Math.cos(angle) * radius, 0.15, Math.sin(angle) * radius);
      stone.rotation.y = Math.random() * Math.PI;
      stone.receiveShadow = true;
      groundGroup.add(stone);
    }

    /* =========================================================
       PROCEDURAL 3D CAT CHARACTER ("Mimi si Kucing Oren")
       ========================================================= */
    const catGroup = new THREE.Group();
    catGroup.position.set(0, 0, 0);
    scene.add(catGroup);

    // Materials - Authentic, vibrant Orange Tabby palette
    const furOrange = new THREE.MeshToonMaterial({ color: 0xf0802b });      // Rich, warm ginger orange
    const furOrangeDark = new THREE.MeshToonMaterial({ color: 0xd15f11 });  // Deeper orange for stripes & accents
    const furCream = new THREE.MeshToonMaterial({ color: 0xfff4e6 });       // Soft warm cream belly, cheeks & paws
    const earInnerPink = new THREE.MeshToonMaterial({ color: 0xff94ad });   // Sweet pink ear interior
    const nosePink = new THREE.MeshToonMaterial({ color: 0xff4d6d });       // Cute strawberry nose
    const collarPink = new THREE.MeshToonMaterial({ color: 0xff2a6d });     // Bright ruby pink collar
    const bellGold = new THREE.MeshStandardMaterial({ color: 0xffd166, metalness: 0.85, roughness: 0.25 });
    const eyeBlack = new THREE.MeshBasicMaterial({ color: 0x1f1f2e });
    const eyeShine = new THREE.MeshBasicMaterial({ color: 0xffffff });

    // Cat Body (Chubby ginger orange egg shape)
    const bodyGeo = new THREE.SphereGeometry(1.05, 32, 28);
    const catBody = new THREE.Mesh(bodyGeo, furOrange);
    catBody.scale.set(1, 1.15, 1.1);
    catBody.position.set(0, 1.15, 0);
    catBody.castShadow = true;
    catBody.receiveShadow = true;
    catGroup.add(catBody);

    // Fluffy warm cream tummy patch
    const tummyGeo = new THREE.SphereGeometry(0.78, 24, 20);
    const tummyPatch = new THREE.Mesh(tummyGeo, furCream);
    tummyPatch.scale.set(0.8, 1.05, 0.45);

    function createFlowerMesh(type = 0) {
      const flower = new THREE.Group();
      const color = petalColors[Math.floor(Math.random() * petalColors.length)];
      const petalMat = new THREE.MeshToonMaterial({ color: color, side: THREE.DoubleSide });
      const centerMat = new THREE.MeshToonMaterial({ color: 0xffd166 }); // yellow center
      const stemMat = new THREE.MeshToonMaterial({ color: 0x48b05b });

      // Stem (Curved gently)

      const stemGeo = new THREE.CylinderGeometry(0.04, 0.05, stemHeight, 8);
      const stem = new THREE.Mesh(stemGeo, stemMat);
      stem.position.y = stemHeight / 2;
      stem.castShadow = true;
      flower.add(stem);

      // Leaves on stem
      const leafGeo = new THREE.SphereGeometry(0.16, 8, 8);
      const leaf1 = new THREE.Mesh(leafGeo, stemMat);
      leaf1.scale.set(0.4, 0.1, 1.4);
      leaf1.rotation.y = 0.5;
      leaf1.rotation.z = 0.4;
      leaf1.position.set(0.12, stemHeight * 0.45, 0);
      flower.add(leaf1);

      const leaf2 = leaf1.clone();
      leaf2.scale.set(0.4, 0.1, 1.4);
      leaf2.rotation.y = -0.8;
      leaf2.rotation.z = -0.4;
      leaf2.position.set(-0.12, stemHeight * 0.35, 0);
      flower.add(leaf2);

      // Flower Blossom Top
      const blossom = new THREE.Group();
      blossom.position.y = stemHeight;

      // Center Disc
      const centerGeo = new THREE.SphereGeometry(0.2, 16, 16);
      const centerMesh = new THREE.Mesh(centerGeo, centerMat);
      centerMesh.scale.set(1, 0.6, 1);
      blossom.add(centerMesh);

      // Petals
      const numPetals = 7 + Math.floor(Math.random() * 5);
      const petalGeo = new THREE.SphereGeometry(0.24, 12, 12);
      for (let p = 0; p < numPetals; p++) {
        const petal = new THREE.Mesh(petalGeo, petalMat);
        petal.scale.set(0.6, 0.15, 1.4);
        const angle = (p / numPetals) * Math.PI * 2;
        petal.position.set(Math.cos(angle) * 0.3, 0.02, Math.sin(angle) * 0.3);
        petal.rotation.y = -angle + Math.PI / 2;
        petal.rotation.x = 0.2;
        petal.castShadow = true;
        blossom.add(petal);
      }

      flower.add(blossom);
      flower.blossom = blossom;
      flower.stemHeight = stemHeight;
      return flower;
    }

    function plantFlower(x, z, animate = true) {
      // Keep on the island mound
      const dist = Math.sqrt(x * x + z * z);
      if (dist > 7.5) {
        const angle = Math.atan2(z, x);
        x = Math.cos(angle) * 7.2;
        z = Math.sin(angle) * 7.2;
      }
      // Avoid planting directly inside the cat
      if (dist < 1.4) {
        x += (x >= 0 ? 1.5 : -1.5);
        z += (z >= 0 ? 1.5 : -1.5);
      }

      const flower = createFlowerMesh();
      flower.position.set(x, 0, z);
      flower.rotation.y = Math.random() * Math.PI * 2;

      if (animate) {
        flower.scale.set(0.001, 0.001, 0.001);
        flower.growProgress = 0;
        flower.isGrowing = true;
      } else {
        flower.scale.set(1, 1, 1);
        flower.isGrowing = false;
      }

      groundGroup.add(flower);
      flowersList.push(flower);

      flowerCounter++;
      flowerCountEl.textContent = flowerCounter;

      return flower;
    }

    /* =========================================================

       ========================================================= */
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function onPointerClick(e) {
      // Don't trigger if clicked on UI
      if (e.target.closest('.ui-layer') || e.target.closest('.top-left-tools') || e.target.closest('.top-right-tools')) {
        return;
      }

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);

      // Check if cat was clicked
      const catIntersects = raycaster.intersectObjects(catGroup.children, true);
      if (catIntersects.length > 0) {
        petCat();
        return;
      }

      // Check ground intersection
      const groundIntersects = raycaster.intersectObject(domeMesh);
      if (groundIntersects.length > 0) {
        const pt = groundIntersects[0].point;
        plantFlower(pt.x, pt.z, true);
        sound.playSprout();

        // Little confetti pop at click point
        confetti({
          particleCount: 15,
          spread: 45,
          origin: {
            x: e.clientX / window.innerWidth,
            y: e.clientY / window.innerHeight
          },
          colors: ['#ff7e40', '#ff6584', '#ffd166']
        });
      }
    }

    window.addEventListener('pointerdown', (e) => {
      // Audio permission unlock on first user gesture
      sound.init();
    });

    window.addEventListener('click', onPointerClick);

    // Mouse tracking for cat head
    window.addEventListener('pointermove', (e) => {
      const normX = (e.clientX / window.innerWidth) * 2 - 1;
      const normY = -(e.clientY / window.innerHeight) * 2 + 1;

    });

    document.getElementById('btnConfetti').addEventListener('click', () => {
      sound.playMeow();
      confetti({
        particleCount: 80,
        spread: 80,
        origin: { y: 0.5 },
        colors: ['#ff4071', '#ff8c42', '#ffd166', '#ffb2c9']
      });
    });

    // Reset Camera
    document.getElementById('btnCameraReset').addEventListener('click', () => {
      camera.position.copy(defaultCamPos);
      controls.target.set(0, 1.2, 0);
      controls.update();
    });

    // Sound toggle
    const btnSound = document.getElementById('btnSound');
    btnSound.addEventListener('click', () => {
      const playing = sound.toggleMusic();
      btnSound.textContent = playing ? '🎶' : '🎵';
      btnSound.style.borderColor = playing ? '#ff4071' : '#ffffff';
    });

    // Theme toggle (Morning -> Sunset -> Fairy Twilight)
    const themes = ['theme-morning', 'theme-sunset', 'theme-twilight'];
    let themeIndex = 0;
    const btnTheme = document.getElementById('btnTheme');

    btnTheme.addEventListener('click', () => {
      themeIndex = (themeIndex + 1) % themes.length;
      document.body.className = themes[themeIndex];

      if (themeIndex === 0) {
        // Morning: Fresh peach & pink
        ambientLight.color.setHex(0xffe8ee);
        ambientLight.intensity = 0.55;
        sunLight.color.setHex(0xfff6ec);
        sunLight.intensity = 0.85;
        btnTheme.textContent = '🌅';
        showSpeech("Pagi cerah yang manis di taman bunga! ☀️🌸");
      } else if (themeIndex === 1) {
        // Sunset: Warm golden orange
        ambientLight.color.setHex(0xffaa77);
        ambientLight.intensity = 0.6;
        sunLight.color.setHex(0xff8833);
        sunLight.intensity = 0.85;
        btnTheme.textContent = '🌇';
        showSpeech("Langit sore jingga keemasan yang cantik! 🌇✨");
      } else {
        // Twilight / Night: Magical fairy violet-pink
        ambientLight.color.setHex(0xb39ddb);
        ambientLight.intensity = 0.5;
        sunLight.color.setHex(0xff66aa);
        sunLight.intensity = 0.65;
        btnTheme.textContent = '🌙';
        showSpeech("Malam peri penuh bintang berkelap-kelip! 🌙✨");
      }
    });

    // Window Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    /* =========================================================
       MAIN RENDER LOOP (60 FPS)
       ========================================================= */
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsedTime = clock.getElapsedTime();
      const delta = clock.getDelta();

      // Controls update
      controls.update();

      // Breathing / idle bounce for cat
      const breath = Math.sin(elapsedTime * 2.5) * 0.04;
      catBody.position.y = 1.15 + breath;
      headGroup.position.y = 2.3 + breath * 1.2;

      // Soft Head rotation tracking cursor
      headGroup.rotation.y += (targetHeadRotY - headGroup.rotation.y) * 0.1;
      headGroup.rotation.x += (targetHeadRotX - headGroup.rotation.x) * 0.1;

      // Tail natural swaying animation
      tailSegments.forEach((seg, idx) => {
        const sway = Math.sin(elapsedTime * 3 + idx * 0.5) * 0.15;
        seg.rotation.z = sway;
      });

      // Jump animation when petted
      if (isJumping) {
        catJumpProgress += 0.06;
        const jumpY = Math.sin(catJumpProgress * Math.PI) * 0.8;
        catGroup.position.y = jumpY;
        catGroup.rotation.y = catJumpProgress * Math.PI * 2; // playful spin!
        if (catJumpProgress >= 1) {
          isJumping = false;
          catGroup.position.y = 0;
          catGroup.rotation.y = 0;
        }
      }

      // Flower Sprout Animations & Gentle Breeze Sway
      flowersList.forEach((flower, idx) => {
        if (flower.isGrowing) {
          flower.growProgress += 0.05;
          const scale = Math.min(1, Math.sin(flower.growProgress * Math.PI * 0.5) * 1.15);
          flower.scale.set(scale, scale, scale);
          if (flower.growProgress >= 1) {
            flower.isGrowing = false;
            flower.scale.set(1, 1, 1);
          }
        }
        // Gentle wind sway
        if (flower.blossom) {
          const windSway = Math.sin(elapsedTime * 2 + idx * 0.4) * 0.06;
          flower.blossom.rotation.z = windSway;
        }
      });

      // Butterflies fluttering & orbiting
      butterflies.forEach((b) => {
        b.angle += b.speed;
        b.mesh.position.x = Math.cos(b.angle) * b.radius;
        b.mesh.position.z = Math.sin(b.angle) * b.radius;
        b.mesh.position.y = b.heightOffset + Math.sin(elapsedTime * 3 + b.angle) * 0.4;
        b.mesh.rotation.y = -b.angle + Math.PI / 2;

        // Wing flapping
        const flap = Math.sin(elapsedTime * b.flapSpeed) * 0.8;
        b.mesh.leftWing.rotation.y = flap;
        b.mesh.rightWing.rotation.y = -flap;
      });

      // Falling Petals
      petalParticles.forEach((p) => {
        p.mesh.position.y -= p.fallSpeed;
        p.mesh.position.x += Math.sin(elapsedTime + p.seed) * 0.015;
        p.mesh.rotation.x += p.rotSpeedX;
        p.mesh.rotation.y += p.rotSpeedY;

        if (p.mesh.position.y < -0.5) {
          p.mesh.position.y = 12;
          p.mesh.position.x = (Math.random() - 0.5) * 18;
          p.mesh.position.z = (Math.random() - 0.5) * 18;
        }
      });

      // Yarn Ball Physics Simulation
      if (yarnBall) {
        yarnBall.vy -= 0.02; // gravity
        yarnBall.y += yarnBall.vy;
        if (yarnBall.y <= yarnBall.targetY) {
          yarnBall.y = yarnBall.targetY;
          yarnBall.vy = -yarnBall.vy * 0.55; // bounce
          yarnBall.bounces++;
          if (yarnBall.bounces > 6) {
            yarnBall.vy = 0;
          }
        }
        yarnBall.mesh.position.y = yarnBall.y;
        yarnBall.mesh.rotation.x += 0.08;
      }

      // Fish Treat Physics Simulation
      if (fishTreat) {
        fishTreat.vy -= 0.018;
        fishTreat.y += fishTreat.vy;
        if (fishTreat.y <= fishTreat.targetY) {
          fishTreat.y = fishTreat.targetY;
          fishTreat.vy = 0;
          // Cat eats the treat!
          setTimeout(() => {
            if (fishTreat) {
              scene.remove(fishTreat.mesh);
              fishTreat = null;
              petCat();
            }
          }, 800);
        }
        fishTreat.mesh.position.y = fishTreat.y;
        fishTreat.mesh.rotation.y += 0.05;
      }

      // Update Speech Bubble Screen Position
      updateSpeechBubblePosition();

      // Render
      renderer.render(scene, camera);
    }

    animate();

    // Initial greeting after 1.2s
    setTimeout(() => {
      showSpeech("Halo Naya & Ruby! Selamat datang di taman kita! 🌸🐾");
    }, 1200);
  </script>
</body>
</html>
